<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>好赚</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f7f3ff;
        color: #171321;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 18px 14px calc(26px + env(safe-area-inset-bottom));
      }
      .intro-card,
      .card {
        border: 1px solid rgba(94, 23, 235, 0.14);
        border-radius: 17px;
        background: #fff;
        box-shadow: 0 8px 22px rgba(94, 23, 235, 0.08);
        padding: 15px 14px;
      }
      .card {
        margin-top: 24px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 11px;
      }
      .head img { width: 44px; height: 44px; object-fit: contain; }
      h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.18;
        font-weight: 900;
      }
      .sub {
        margin: 3px 0 0;
        color: #6b6474;
        font-size: 12px;
        font-weight: 700;
      }
      .intro-text {
        display: block;
        color: #5f5966;
        font-size: 13px;
        font-weight: 650;
        line-height: 1.68;
      }
      label,
      .field-block {
        display: block;
        margin-top: 10px;
        color: #4b4453;
        font-size: 13px;
        font-weight: 800;
      }
      input, select, textarea {
        width: 100%;
        margin-top: 6px;
        border: 1px solid #ddd7e8;
        border-radius: 11px;
        background: #fff;
        color: #171321;
        font: inherit;
        font-size: 13px;
        outline: none;
        padding: 10px 11px;
      }
      textarea { min-height: 40px; resize: vertical; line-height: 1.5; }
      input:focus, select:focus, textarea:focus { border-color: #6c27d6; box-shadow: 0 0 0 3px rgba(108, 39, 214, 0.10); }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .chip {
        border: 1px solid #ddd7e8;
        border-radius: 999px;
        background: #fff;
        color: #5d5666;
        font-size: 13px;
        font-weight: 800;
        min-height: 31px;
        padding: 0 13px;
      }
      .chip.on {
        border-color: #6c27d6;
        background: #6c27d6;
        color: #fff;
      }
      .panel {
        display: grid;
        gap: 8px;
        margin-top: 11px;
        border-radius: 12px;
        background: #f8f6ff;
        padding: 10px;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
      }
      .check input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .check-circle {
        width: 15px;
        height: 15px;
        margin-top: 2px;
        flex: 0 0 15px;
        border: 1px solid #6c27d6;
        border-radius: 999px;
        background: #fff;
        color: #6c27d6;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        opacity: 0.4;
      }
      .check input[type="checkbox"]:checked + .check-circle {
        opacity: 1;
      }
      .msg {
        display: none;
        margin-top: 12px;
        border-radius: 11px;
        padding: 10px 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .msg.ok { display: block; background: #effaf4; color: #166534; }
      .msg.err { display: block; background: #fff1f2; color: #be123c; }
      button[type="submit"] {
        width: 100%;
        margin-top: 13px;
        border: 0;
        border-radius: 13px;
        background: #6c27d6;
        color: #fff;
        font-size: 15px;
        font-weight: 900;
        padding: 13px;
        box-shadow: 0 7px 16px rgba(108, 39, 214, 0.24);
      }
      button[type="submit"]:disabled {
        background: #c8c2d3;
        box-shadow: none;
      }
      .notes {
        margin-top: 16px;
        display: grid;
        gap: 12px;
        color: #39206f;
        font-size: 12px;
        font-weight: 800;
      }
      .notes div {
        min-height: 52px;
        display: flex;
        align-items: center;
        border: 1px solid rgba(94, 23, 235, 0.1);
        border-radius: 16px;
        background: #f1eaff;
        padding: 0 14px;
      }
      .upload-hint {
        display: block;
        margin-top: 4px;
        color: #8b8792;
        font-size: 11px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro-card">
        <div class="head">
          <img src="/assets/mama-hao-zhuan-icon.png" alt="" />
          <h1>好赚</h1>
        </div>
        <div class="intro-text">如果你愿意用自己的小红书账号接亲子、教育、家庭消费相关发稿，可以先把基础资料提交给我们，通过审核，我们会联系您入群，进行后续任务派发。</div>
        <div class="notes">
          <div>小红书优先，收主页链接</div>
          <div>不需要账号密码，不要求代登录</div>
          <div>数据用于审核匹配，可联系运营更新或停用资料</div>
        </div>
      </section>
      <form id="mama-resource-apply-form" class="card">
        <div class="head">
          <div>
            <h1>资料提交</h1>
            <p class="sub">填写基础资料后进入待审核</p>
          </div>
        </div>

        <div class="grid">
          <label>姓名/昵称<input name="displayName" placeholder="例如：安安妈妈" required /></label>
          <label>微信号<input name="contactWechat" placeholder="优先通过微信添加" required /></label>
          <label>手机号<input name="contactPhone" placeholder="备用联系电话" /></label>
          <label>城市<input name="city" placeholder="上海 / 杭州" /></label>
          <label>
            孩子阶段
            <select name="childStage">
              <option value="">请选择</option>
              <option>孕产/婴幼儿</option>
              <option>幼儿园</option>
              <option>小学</option>
              <option>初中</option>
              <option>高中</option>
              <option>多孩家庭</option>
            </select>
          </label>
          <div class="field-block">
            孩子性别
            <div class="chips gender-options" id="childGenderOptions">
              <button type="button" class="chip" data-value="男孩">男孩</button>
              <button type="button" class="chip" data-value="女孩">女孩</button>
            </div>
          </div>
          <label>小红书主页链接<input name="xiaohongshuProfileUrl" placeholder="可粘贴整段口令或主页短链接" required /></label>
          <label>
            小红书页面截图
            <input id="xiaohongshuScreenshotFile" type="file" accept="image/*" />
            <span class="upload-hint" id="xiaohongshuScreenshotStatus">从手机相册选择小红书主页截图</span>
          </label>
          <label>粉丝数<input name="followerCount" inputmode="numeric" placeholder="例如：12800" /></label>
          <div class="field-block">
            是否实名认证
            <div class="chips gender-options" id="realNameVerifiedOptions">
              <button type="button" class="chip" data-value="yes">已实名</button>
              <button type="button" class="chip" data-value="no">未实名</button>
            </div>
          </div>
        </div>

        <label>账号定位<textarea name="accountPositioning" placeholder="例如：亲子阅读、学习规划、家居收纳、母婴好物"></textarea></label>

        <label>
          可发品类
          <div class="chips" id="categoryChips">
            <button type="button" class="chip" data-value="亲子阅读">亲子阅读</button>
            <button type="button" class="chip" data-value="学习用品">学习用品</button>
            <button type="button" class="chip" data-value="母婴">母婴</button>
            <button type="button" class="chip" data-value="儿童健康">儿童健康</button>
            <button type="button" class="chip" data-value="家庭消费">家庭消费</button>
            <button type="button" class="chip" data-value="教育规划">教育规划</button>
          </div>
        </label>

        <div class="panel">
          <label>暂不接的品类<input name="blockedCategories" placeholder="例如：医美、金融、成人用品" /></label>
          <label class="check"><input name="consentAccepted" type="checkbox" required /><span class="check-circle">✓</span>我同意家和万事团队为发稿资源匹配和运营联系使用以上资料</label>
        </div>

        <div class="msg" id="message"></div>
        <button type="submit">提交资料，进入待审核</button>
      </form>
    </main>
    <script>
      const form = document.getElementById("mama-resource-apply-form");
      const message = document.getElementById("message");
      const selectedCategories = new Set();
      let childGender = "";
      let xiaohongshuScreenshotUrl = "";
      let realNameVerified = null;

      document.getElementById("categoryChips").addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        const value = button.dataset.value;
        if (selectedCategories.has(value)) {
          selectedCategories.delete(value);
          button.classList.remove("on");
        } else {
          selectedCategories.add(value);
          button.classList.add("on");
        }
      });

      document.getElementById("childGenderOptions").addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        childGender = button.dataset.value || "";
        document.querySelectorAll("#childGenderOptions .chip").forEach((item) => {
          item.classList.toggle("on", item === button);
        });
      });

      document.getElementById("realNameVerifiedOptions").addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        const value = button.dataset.value || "";
        realNameVerified = value === "yes" ? true : value === "no" ? false : null;
        document.querySelectorAll("#realNameVerifiedOptions .chip").forEach((item) => {
          item.classList.toggle("on", item === button);
        });
      });

      document.getElementById("xiaohongshuScreenshotFile").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const status = document.getElementById("xiaohongshuScreenshotStatus");
        const data = new FormData();
        data.append("file", file);
        status.textContent = "截图上传中...";
        try {
          const response = await fetch("/api/mama-resources/uploads", { method: "POST", body: data });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.message || result.error || "截图上传失败");
          xiaohongshuScreenshotUrl = result.url || "";
          status.textContent = "已上传，可继续提交";
        } catch (error) {
          xiaohongshuScreenshotUrl = "";
          status.textContent = error && error.message ? error.message : "截图上传失败，请稍后重试";
        } finally {
          event.target.value = "";
        }
      });

      function showMessage(type, text) {
        message.className = "msg " + type;
        message.textContent = text;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        const data = new FormData(form);
        const payload = {
          displayName: String(data.get("displayName") || "").trim(),
          contactPhone: String(data.get("contactPhone") || "").trim(),
          contactWechat: String(data.get("contactWechat") || "").trim(),
          city: String(data.get("city") || "").trim(),
          childStage: String(data.get("childStage") || ""),
          childGender,
          xiaohongshuProfileUrl: String(data.get("xiaohongshuProfileUrl") || "").trim(),
          xiaohongshuScreenshotUrl,
          followerCount: String(data.get("followerCount") || "").trim(),
          realNameVerified,
          accountPositioning: String(data.get("accountPositioning") || "").trim(),
          categories: Array.from(selectedCategories),
          blockedCategories: String(data.get("blockedCategories") || "").trim(),
          consentAccepted: data.get("consentAccepted") === "on"
        };

        button.disabled = true;
        button.textContent = "提交中...";
        try {
          const response = await fetch("/api/mama-resources/applications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.message || result.error || "提交失败，请稍后重试");
          form.reset();
          selectedCategories.clear();
          childGender = "";
          xiaohongshuScreenshotUrl = "";
          realNameVerified = null;
          document.querySelectorAll(".chip.on").forEach((item) => item.classList.remove("on"));
          document.getElementById("xiaohongshuScreenshotStatus").textContent = "从手机相册选择小红书主页截图";
          showMessage("ok", "资料已提交，我们会先完成账号审核，再联系你确认适合的发稿机会。");
        } catch (error) {
          showMessage("err", error && error.message ? error.message : "提交失败，请稍后重试");
        } finally {
          button.disabled = false;
          button.textContent = "提交资料，进入待审核";
        }
      });
    </script>
  </body>
</html>
